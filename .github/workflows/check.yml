name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # hangar drives launchd on macOS and systemd on Linux, and each platform's
    # supervisor, metrics and tests only compile there — so the checks run on
    # both rather than cross-compiling one from the other.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Matches the Makefile's GO_VERSION pin, which makes the build reuse this
      # Go instead of downloading a second one into .toolchain/.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: false

      # Builds from the checkout alone. A package missing from the commit — the
      # failure mode a local working tree cannot show you — fails here.
      - run: make check
